services:

  # ---- Apache: serves hub files + bigWig data to UCSC/GWIPS ----
  apache:
    image: httpd:2.4-alpine3.23
    container_name: ribohub-apache
    ports:
      - "${APACHE_PORT:-80}:80"
    volumes:
      - hub-output:/usr/local/apache2/htdocs/hubs:ro
      - ${BIGWIG_DIR:?Set BIGWIG_DIR in .env}:/usr/local/apache2/htdocs/data:ro
      - ./docker/apache.conf:/usr/local/apache2/conf/httpd.conf:ro
    restart: unless-stopped

  # ---- Galaxy: runs RiboHub tool, writes hubs to shared volume ----
  galaxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.galaxy
    container_name: ribohub-galaxy
    ports:
      - "${GALAXY_PORT:-8080}:80"
    volumes:
      - hub-output:/export/galaxy/hub_output
      - ${BIGWIG_DIR:?Set BIGWIG_DIR in .env}:/data/bigwig:ro
      - ${METADATA_CSV:?Set METADATA_CSV in .env}:/data/metadata.csv:ro
    environment:
      - RIBOHUB_DATA_DIR=/data/bigwig
      - RIBOHUB_BASE_URL=http://${SERVER_IP:?Set SERVER_IP in .env}:${APACHE_PORT:-80}/data
      - RIBOHUB_METADATA=/data/metadata.csv
      - RIBOHUB_OUTPUT_DIR=/export/galaxy/hub_output
      - SERVER_IP=${SERVER_IP}
    restart: unless-stopped

volumes:
  hub-output: